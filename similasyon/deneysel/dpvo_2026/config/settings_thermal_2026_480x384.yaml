# Isolated thermal-camera experiment. 480x384 preserves the native 5:4 aspect
# ratio while keeping feature memory below the live RGB 640x360 input budget.
camera:
  profile: config/camera/profiles/thyz_2026_thermal_640x512_v1.yaml

dpvo:
  calibration_width: 640
  calibration_height: 512
  input_width: 480
  input_height: 384

model_paths:
  camera_calib: config/camera/profiles/thyz_2026_thermal_640x512_v1_K.txt
