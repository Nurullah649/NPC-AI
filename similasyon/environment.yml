name: hyz
channels:
  - pyg
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - pip
  - python=3.10
  - pytorch=2.3.1
  - pytorch-scatter=2.1.2
  - pytorch-cuda=12.1
  - torchvision=0.18
  - pip:
    # Official TEKNOFEST requirements
    - python-decouple
    - requests>=2.31.0
    - pillow>=10.4.0
    - tqdm
    
    # DPVO dependencies
    - tensorboard
    - numba
    - einops
    - pypose
    - kornia
    - numpy==1.26.4
    - plyfile
    - evo
    - opencv-python
    - yacs
    
    # Our model deps
    - ultralytics
    - scipy
    - scikit-learn
    - filterpy
    - pytest
    - git+https://github.com/cvg/LightGlue.git
