name: hyz
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
  - pyg
dependencies:
  - pip
  - python=3.10
  - pytorch=2.3.1
  - pytorch-cuda=12.1
  - torchvision=0.18.1
  - pytorch-scatter=2.1.2
  - pip:
    - ultralytics
    - opencv-python==4.9.0.80
    - numpy==1.26.4
    - scipy
    - scikit-learn
    - filterpy
    - kornia
    - yacs
    - einops
    - pypose
    - tqdm
    - pillow
    - requests
    - python-decouple
    - pytest
    - tensorboard
    - numba
    - plyfile
