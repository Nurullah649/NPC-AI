debug:
  save_payloads: true
  save_visuals: true
  visual_jpeg_quality: 80
  visual_max_width: 1600
  visual_output_dir: _debug/server_annotated_test1
camera:
  profile: config/camera/profiles/thyz_2026_rgb_1920x1080_v1.yaml
detector:
  conf_thresholds:
    Insan: 0.2
    Tasit: 0.25
    UAI: 0.2
    UAP: 0.2
  imgsz: 1280
  iou_threshold: 0.7
  max_det: 300
  resize_max_height: 1080
  sahi_max_extra_persons: 100
  sahi_overlap_height_ratio: 0.25
  sahi_overlap_width_ratio: 0.25
  sahi_person_conf: 0.15
  sahi_person_iou_merge: 0.5
  sahi_slice_height: 640
  sahi_slice_width: 640
  use_sahi_for_person: false
dpvo:
  absolute_ridge_alpha: 0.1
  anchor_at_calib_end: true
  buffer_size: 4096
  calibration_height: 1080
  calibration_width: 1920
  cuda_empty_cache_every: 25
  delta_fit_intercept: false
  delta_ridge_alpha: 0.0
  delta_window: 9
  direction_guard_min_points: 30
  fallback_velocity: true
  fallback_velocity_decay: 0.98
  fit_method: linear
  input_height: 360
  input_width: 640
  linear_condition_max: 1000000.0
  max_allowed_scale: 50.0
  max_fallback_frames: 30
  min_allowed_scale: 0.02
  min_calib_frames: 50
  min_direction_similarity: -0.2
  min_gt_samples: 5
  random_seed: 0
  runtime_log_every: 25
  use_direction_guard: true
landing:
  classifier_dropout: 0.36
  classifier_hard_fail_open: true
  classifier_threshold: 0.5
  hard_veto_obstacles: true
  near_buffer_px: 20
  overlap_threshold: 0.2
  use_classifier: true
model_paths:
  # Compatibility path for consumers that only accept a numeric K matrix.
  # PositioningDPVO uses the canonical camera.profile above.
  camera_calib: config/camera/profiles/thyz_2026_rgb_1920x1080_v1_K.txt
  detector: weights/detector/best.pt
  dpvo: weights/dpvo/dpvo.pth
  dpvo_cfg: config/dpvo/npc.yaml
  landing_classifier: weights/landing/son_en_iyi_model.pth
motion:
  # Motion V2: kamera donusu + kamera-relative arac hizi + yerel optical flow.
  camera_model: homography
  affine_fallback: true
  median_shift_fallback: true
  mask_detection_regions: true
  min_inlier_ratio: 0.35
  max_reprojection_error: 5.0
  feature_type: orb
  max_features: 800
  kalman_enabled: true
  kalman_process_noise: 1.0
  kalman_measurement_noise: 10.0
  camera_relative_velocity_enabled: true
  relative_velocity_alpha: 0.65
  missed_velocity_decay: 0.92
  min_track_len: 4
  max_track_age: 15
  track_match_distance: 90.0
  # S ekranda ve kararda piksel cinsinden kalir.
  normalize_by_bbox_diagonal: false
  moving_start_threshold: 45.0
  moving_stop_threshold: 35.0
  motion_window: 6
  decision_window: 5
  moving_votes_required: 3
  affine_min_matches: 12
  affine_ransac_threshold: 5.0
  high_conf_threshold: 0.40
  low_conf_threshold: 0.15
  two_stage_association: true
  dynamic_gating: true
  gate_diagonal_ratio: 1.5
  maha_gate_threshold: 9.49
  maha_gate_min_distance: 60.0
  maha_gate_diagonal_ratio: 0.25
  use_local_optical_flow: true
  local_flow_weight: 0.50
  local_flow_score_weight: 0.50
  local_flow_min_points: 4
  local_flow_max_error: 20.0
  local_flow_max_mad: 20.0
  local_flow_max_residual: 250.0
  local_flow_max_track_age: 2
  deduplicate_vehicle_detections: true
  duplicate_iou_threshold: 0.85
preprocessing:
  apply_to_detector: true
  apply_to_landing_classifier: true
  apply_to_reference_matcher: false
  brightness_threshold: 50
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: 8
  split_cols: 3
  split_rows: 2
  use_clahe: true
reference:
  device: auto
  extractor: aliked
  matcher: lightglue
  min_inlier_ratio: 0.25
  min_inliers: 8
  min_matches: 10
  use_dinov2_fallback: false
reference_roi_experiment:
  # Ana simulasyon Gorev 3 pipeline'i. Eslestirme yoksa bbox uretmez.
  enabled: true
  precompute_all_references: true
  scene_keyframe_step: 3
  scene_max_keyframes: 9
  scene_min_keyframes: 3
  # Kismi sahne eslesmesi o karede raporlanabilir; tracker ancak nesnenin en
  # az yarisi gorunuyorsa baslatilir. Cikista zeminin takip edilmesini onler.
  scene_track_min_visible_ratio: 0.50
  # Ref-5 termal/RGB dogrudan eslesmesi guvenli degil; sahne hafizasi
  # reddederse daha zayif matcher'lar o karede devreye giremez.
  scene_alias_requires_validation: true
  persist_scene_memory: true
  scene_memory_filename: _reference_scene_memory.json
  full_min_frame_coverage: 0.0005
  full_max_frame_coverage: 0.85
  full_max_frame_coverage_by_order:
    "5": 0.45
  # Bu oturumda Ref-1 ve Ref-5 ayni sabit bicerdöverin RGB/termal
  # gorunumleridir. Baska oturumda ayni-nesne bagi dogrulanmadan eklenmemeli.
  scene_aliases:
    "5": 1
  # YOLO Ref-1'de yalniz ana govdeyi buldugu icin bicme tablasini da kapsa.
  roi_seed_expansion_by_order:
    "1":
      left: 0.25
      right: 0.55
      top: 0.25
      bottom: 0.25
  expand_ratio: 0.25
  target_long_side: 360
  max_scale: 4
  candidate_min_conf: 0.25
  duplicate_iou: 0.85
  min_matches: 10
  min_inliers: 8
  min_inlier_ratio: 0.15
  max_reprojection_error: 5.0
  min_projection_coverage: 0.30
  max_projection_coverage: 1.00
  min_projection_aspect: 0.40
  max_projection_aspect: 4.00
  min_candidate_iou: 0.20
  min_reference_hull_coverage: 0.002
  min_roi_hull_coverage: 0.01
  min_color_hist_correlation: 0.25
  max_color_hist_bhattacharyya: 0.60
  scene_relocalizer:
    max_features: 2000
    min_confidence: 0.75
    min_inliers: 30
    min_inlier_ratio: 0.30
    max_reprojection_error: 4.0
    ransac_threshold: 4.0
    min_visible_ratio: 0.25
    min_area_ratio: 0.20
    max_area_ratio: 5.00
    min_color_correlation: 0.65
    max_color_distance: 0.38
    output_expand_left_ratio: 0.20
    output_expand_right_ratio: 0.05
    output_expand_top_ratio: 0.15
    output_expand_bottom_ratio: 0.05
  tracker:
    max_features: 1600
    min_inlier_ratio: 0.30
    max_reprojection_error: 4.0
    affine_min_matches: 16
    ransac_threshold: 4.0
    min_transform_confidence: 0.12
    min_step_area_ratio: 0.55
    max_step_area_ratio: 1.80
    min_visible_ratio: 0.30
    min_color_correlation: 0.05
    max_color_distance: 0.85
    max_unreliable_frames: 2
